    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9C3FF"/><stop offset="1" stop-color="#5468F0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#5468F0" stop-opacity=".35"/><stop offset="1" stop-color="#5468F0" stop-opacity="0"/></radialGradient>
