name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Parakeet helper (FluidAudio) needs a recent Swift compiler; older ones crash on it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import the stable signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/release.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Build universal app, dmg and zip
        env:
          VISIONCLI_SIGN_IDENTITY: VisionCLI Release
        run: sh scripts/package-release.sh
      - name: Check the signature
        run: codesign -dr - overlay/build/VisionCLI.app 2>&1 | tail -1
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt

  # Linux: AppImage + .deb per arch (app/scripts/package-release.sh), built natively on x64 and arm64 runners.
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: fpm for the arm64 .deb (electron-builder only bundles an x86_64 one)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby
          sudo gem install --no-document fpm
      - name: Build AppImage and .deb
        run: sh app/scripts/package-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Adds the Linux files to the release the macOS job created, and their sums to its SHA256SUMS.txt.
  linux-release:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt --clobber || touch SHA256SUMS.txt
          grep -v -E '\.(AppImage|deb)$' SHA256SUMS.txt > sums.tmp || true
          sha256sum *.AppImage *.deb >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" *.AppImage *.deb SHA256SUMS.txt --clobber

  # Windows: a per-user NSIS installer per arch (app/scripts/package-release-win.ps1), built natively on x64 and arm64.
  # (Without the arm64 runner, build arm64 on windows-latest instead: the script cross-builds with -Arch arm64.)
  windows:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Build the installer
        shell: pwsh
        run: ./app/scripts/package-release-win.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error

  # Adds the Windows installers to the release and their sums to SHA256SUMS.txt. Runs after linux-release (both
  # rewrite SHA256SUMS.txt), whether or not that one succeeded.
  windows-release:
    needs: [build, linux-release, windows]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt --clobber || touch SHA256SUMS.txt
          grep -v -E '\.exe$' SHA256SUMS.txt > sums.tmp || true
          sha256sum *.exe >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" *.exe SHA256SUMS.txt --clobber
