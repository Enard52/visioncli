name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance (actions/attest-build-provenance): a signed statement that each release file came from this
  # workflow. GitHub's free plans attest public repositories only, hence the private == false guards.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Parakeet helper (FluidAudio) needs a recent Swift compiler; older ones crash on it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import the stable signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/release.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Build universal app, dmg and zip
        env:
          VISIONCLI_SIGN_IDENTITY: VisionCLI Release
        run: sh scripts/package-release.sh
      - name: Check the signature
        run: codesign -dr - overlay/build/VisionCLI.app 2>&1 | tail -1
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
      # Verify with: gh attestation verify <file> -R thethirdsourcers/visioncli
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

  # Linux: AppImage + .deb + .rpm + the unpacked tarball (Flatpak/snap input) per arch (app/scripts/package-release.sh),
  # built natively on x64 and arm64 runners.
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: fpm for the arm64 .deb (electron-builder only bundles an x86_64 one)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby
          sudo gem install --no-document fpm
      - name: rpmbuild for the .rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
      - name: Build AppImage, .deb, .rpm and the tarball
        run: sh app/scripts/package-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error

  # Adds the Linux files to the release the macOS job created, and their sums to its SHA256SUMS.txt.
  linux-release:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt --clobber || touch SHA256SUMS.txt
          grep -v -E '\.(AppImage|deb|rpm|tar\.gz)$' SHA256SUMS.txt > sums.tmp || true
          sha256sum *.AppImage *.deb *.rpm *.tar.gz >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" *.AppImage *.deb *.rpm *.tar.gz SHA256SUMS.txt --clobber
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  # Windows: a per-user NSIS installer per arch (app/scripts/package-release-win.ps1), built natively on x64 and arm64.
  # (Without the arm64 runner, build arm64 on windows-latest instead: the script cross-builds with -Arch arm64.)
  windows:
    strategy:
      fail-fast: false # one arch failing shouldn't cancel the other
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # SignPath (free for open source, packaging/windows/SIGNPATH.md) signs VisionCLI.exe and vcli-win.exe before
      # NSIS packs them, then the installer. Without its token and variables everything stays unsigned, as before.
      - name: Code signing configured?
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ] && [ -n "$SIGNPATH_PROJECT_SLUG" ] && [ -n "$SIGNPATH_SIGNING_POLICY_SLUG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Windows code signing skipped: SIGNPATH_API_TOKEN or the SIGNPATH_* variables aren't set (packaging/windows/SIGNPATH.md). The installer is unsigned."
          fi
      - name: Build the installer
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: ./app/scripts/package-release-win.ps1 -Arch ${{ matrix.arch }}
      - name: Pack the app (to sign)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./app/scripts/package-release-win.ps1 -Arch ${{ matrix.arch }} -Stage unpacked
      - name: Upload the unsigned app for SignPath
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: app/dist/${{ matrix.arch == 'x64' && 'win-unpacked' || 'win-arm64-unpacked' }}
          if-no-files-found: error
      - name: Sign the app's exes
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: app/dist/signed-unpacked
      - name: Build the installer from the signed app
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./app/scripts/package-release-win.ps1 -Arch ${{ matrix.arch }} -Stage installer -Unpacked app/dist/signed-unpacked
      - name: Upload the unsigned installer for SignPath
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed
      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Move-Item -Force release-signed/*.exe release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
      # Microsoft Store: an .msix from the same (signed, if signing ran) app, only once the Partner Center identity is
      # set (packaging/windows/STORE.md). Not a release file: the Store signs it on submission; upload it there.
      - name: Store package configured?
        id: store
        shell: bash
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [ -n "$MS_STORE_IDENTITY_NAME" ] && [ -n "$MS_STORE_PUBLISHER" ] && [ -n "$MS_STORE_PUBLISHER_DISPLAY_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Microsoft Store package skipped: the MS_STORE_* variables aren't set (packaging/windows/STORE.md)."
          fi
      - name: Build the Store package (.msix)
        if: steps.store.outputs.enabled == 'true'
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: >-
          ./app/scripts/package-release-win.ps1 -Arch ${{ matrix.arch }} -Stage store
          -Unpacked ${{ steps.signing.outputs.enabled == 'true' && 'app/dist/signed-unpacked' || format('app/dist/{0}', matrix.arch == 'x64' && 'win-unpacked' || 'win-arm64-unpacked') }}
      - if: steps.store.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: release/*.msix
          if-no-files-found: error

  # Adds the Windows installers to the release and their sums to SHA256SUMS.txt. Runs after linux-release (both
  # rewrite SHA256SUMS.txt), whether or not that one succeeded.
  windows-release:
    needs: [build, linux-release, windows]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: release
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt --clobber || touch SHA256SUMS.txt
          grep -v -E '\.exe$' SHA256SUMS.txt > sums.tmp || true
          sha256sum *.exe >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" *.exe SHA256SUMS.txt --clobber
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/SHA256SUMS.txt

  # ── Distribution channels (docs/DISTRIBUTION.md). Each one skips with a notice until its secret exists. ──────────

  # The website and the apt/dnf repositories on GitHub Pages. Called from here because a release created with
  # GITHUB_TOKEN doesn't trigger site.yml's own `release: published` event.
  site:
    needs: [build, linux-release, windows-release]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Homebrew cask in thethirdsourcers/homebrew-tap (packaging/homebrew/visioncli.rb, sha256 filled in here).
  homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Tap token configured?
        id: check
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Homebrew tap not updated: HOMEBREW_TAP_TOKEN isn't set (packaging/homebrew/README.md)."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - name: Update Casks/visioncli.rb
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p "VisionCLI-$version-macos.dmg" -D "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/VisionCLI-$version-macos.dmg" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/thethirdsourcers/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 .*/  sha256 \"$sha\"/" \
            packaging/homebrew/visioncli.rb > "$RUNNER_TEMP/tap/Casks/visioncli.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/visioncli.rb
          git diff --cached --quiet && { echo "Cask already at $version"; exit 0; }
          git commit -m "visioncli $version"
          git push

  # winget: a pull request to microsoft/winget-pkgs for each new version. The first version goes in by hand
  # (packaging/winget/README.md); the action only updates a package that exists.
  winget:
    needs: windows-release
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: winget token configured?
        id: check
        shell: bash
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::winget not updated: WINGET_TOKEN isn't set (packaging/winget/README.md)."; fi
      - if: steps.check.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: TheThirdSourcers.VisionCLI
          installers-regex: 'windows-(x64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  # Snap Store (classic confinement, packaging/snap/README.md), repackaging the release tarball per arch.
  snap:
    needs: linux-release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Snap Store credentials configured?
        id: check
        run: |
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Snap not published: SNAPCRAFT_STORE_CREDENTIALS isn't set (packaging/snap/README.md)."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - name: Point snapcraft.yaml at this release
        if: steps.check.outputs.enabled == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -e "s/^version: .*/version: '$version'/" -e "s/@VERSION@/$version/g" packaging/snap/snapcraft.yaml
          cp docs/logo.png packaging/snap/visioncli.png
          grep -n -e '^version' -e 'source:' packaging/snap/snapcraft.yaml
      - if: steps.check.outputs.enabled == 'true'
        uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - if: steps.check.outputs.enabled == 'true'
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
