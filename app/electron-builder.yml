# electron-builder config for the desktop app. Linux: AppImage + .deb + .rpm; Windows: a per-user NSIS installer (and
# an MSIX for the Microsoft Store, only when its identity is given). x64 and arm64.
#   npm run dist                                   (Linux, every format, host arch)
#   npx electron-builder --linux AppImage deb rpm --x64 --arm64
#   npx electron-builder --win nsis --x64          (one arch per run: several at once would make one combined installer)
# Run `node build.mjs` first (npm run dist does). beforePack stages the MCP server's DB drivers next to it.
appId: dev.visioncli.overlay
productName: VisionCLI
copyright: Copyright © Third Sourcers
directories:
  output: dist
  # Not "build": that's where build.mjs writes the app, and electron-builder never packs its buildResources dir.
  buildResources: resources

# Electron's WM_CLASS (X11) comes from productName, the Wayland app_id from desktopName: both must match the .desktop file.
extraMetadata:
  productName: VisionCLI
  desktopName: visioncli.desktop
  homepage: https://github.com/thethirdsourcers/visioncli

files:
  - package.json
  - build/**
  - "!build/tests{,/**}"
  # The MCP server runs outside the asar (Node mode can't resolve its node_modules inside one).
  - "!build/server{,/**}"
# Every platform (the Linux-only ones are a few KB, unused on Windows); win adds its own below (electron-builder merges the lists).
extraResources:
  # resources/server/index.mjs + node_modules/{mysql2,pg}: `visioncli-mcp` runs it with ELECTRON_RUN_AS_NODE=1.
  - from: build/server
    to: server
  # Shell helpers, icons and the systemd unit, readable by plain shell scripts (not inside app.asar).
  - from: resources/bin
    to: bin
    filter: ["**/*", "!vcli-win.exe*"]
  - from: resources/icons
    to: icons
  - from: resources/systemd
    to: systemd
  - from: resources/visioncli.desktop
    to: visioncli.desktop
  - from: scripts/install-deps.sh
    to: bin/install-deps.sh
  # Also as plain files (gnome-extensions install / kwin scripting load need real paths, not asar ones).
  - from: resources/gnome-extension
    to: gnome-extension
  - from: resources/kwin
    to: kwin
  # kokoro_server.py runs under python (uv), which can't read files inside app.asar.
  - from: build/assets/kokoro_server.py
    to: assets/kokoro_server.py

# dbus-next and marked are pure JS; there is nothing native to rebuild.
npmRebuild: false
beforePack: scripts/before-pack.cjs
# Replaces the binary with a launcher that keeps Chromium's sandbox on whenever the system allows it.
afterPack: scripts/after-pack.cjs

linux:
  executableName: visioncli
  icon: resources/icons
  category: Development
  synopsis: Voice and screen co-assistant for developers
  description: >-
    AI co-assistant for developers that sees your screen and uses your computer: ask about what you're
    looking at or have it do the task, by typing or voice, with Claude Code or Gemini.
  maintainer: Third Sourcers <visioncli@thethirdsourcers.com>
  vendor: Third Sourcers
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    StartupWMClass: VisionCLI
    Keywords: voice;assistant;claude;screen;ai;
    StartupNotify: "false"

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # electron-builder's AppImage entry would hard-code --no-sandbox; the launcher decides instead (and drops this marker).
  executableArgs:
    - --vcli-desktop

deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  afterInstall: resources/deb/postinst
  afterRemove: resources/deb/postrm
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libgbm1
    - libasound2 | libasound2t64
    - libsecret-1-0
    - at-spi2-core
    - tmux
    - pipewire-bin | pulseaudio-utils
  recommends:
    # X11 sessions (and XWayland windows)
    - xdotool
    # Hold-to-talk without the input group reads keys through XInput2
    - xinput
    - wmctrl
    - x11-utils
    - maim | imagemagick
    - xclip
    # Wayland sessions
    - grim
    - slurp
    - wl-clipboard
    # Accessibility tree and offline speech
    - python3-gi
    - gir1.2-atspi-2.0
    - espeak-ng

# Fedora / openSUSE (and the dnf repository on the site): the .deb's dependencies under their rpm names; rich
# dependencies "(a or b)" cover both families. The .deb's scripts work here too (they check what the system has).
rpm:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  afterInstall: resources/deb/postinst
  afterRemove: resources/deb/postrm
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - (mesa-libgbm or libgbm1)
    - (alsa-lib or libasound2)
    - (libsecret or libsecret-1-0)
    - tmux
    - (pipewire-utils or pulseaudio-utils)
  # fpm has no --rpm-recommends: weak dependencies go in as raw spec tags (the .deb's recommends).
  fpm:
    - --rpm-tag
    - "Recommends: xdotool"
    - --rpm-tag
    - "Recommends: xinput"
    - --rpm-tag
    - "Recommends: wmctrl"
    - --rpm-tag
    - "Recommends: xprop"
    - --rpm-tag
    - "Recommends: (maim or ImageMagick)"
    - --rpm-tag
    - "Recommends: xclip"
    - --rpm-tag
    - "Recommends: grim"
    - --rpm-tag
    - "Recommends: slurp"
    - --rpm-tag
    - "Recommends: wl-clipboard"
    - --rpm-tag
    - "Recommends: (python3-gobject or python3-gobject-base)"
    - --rpm-tag
    - "Recommends: espeak-ng"

# Windows: VisionCLI.exe with the C# helper next to it; installs per user to %LOCALAPPDATA%\Programs\VisionCLI (no admin).
win:
  icon: resources/win/icon.ico
  target: nsis
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  extraResources:
    # vcli-win.exe (+ its .config), built by native/windows/build.sh into resources/bin.
    - from: resources/bin
      to: bin
      filter: ["vcli-win.exe*"]
    # visioncli-mcp.cmd (copied to %LOCALAPPDATA%\visioncli\bin) and the bootstrap it runs.
    - from: resources/win
      to: win
      filter: ["visioncli-mcp.cmd", "visioncli-mcp.cjs"]
    # The Visual C++ runtime for whisper.cpp's MSVC build, copied app-local next to whisper-server.exe when the PC
    # doesn't have it (redistributable DLLs, staged from the build machine's System32 by package-release-win.ps1).
    - from: resources/win32/vcruntime
      to: win32/vcruntime

nsis:
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  # Start menu shortcut carrying the AppUserModelID (appId, dev.visioncli.overlay) so notifications are the app's.
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: VisionCLI
  installerIcon: resources/win/icon.ico
  uninstallerIcon: resources/win/icon.ico
  # Settings in %APPDATA%\visioncli stay on uninstall (like the other platforms).
  deleteAppDataOnUninstall: false
  # visioncli:// protocol and the MCP wrapper copy (HKCU / %LOCALAPPDATA% only).
  include: resources/win/installer.nsh

# Microsoft Store (MSIX). Built only when the Partner Center identity is set: package-release-win.ps1 -Store passes
# MS_STORE_IDENTITY_NAME / MS_STORE_PUBLISHER / MS_STORE_PUBLISHER_DISPLAY_NAME as -c.appx.* (the Store re-signs it).
appx:
  artifactName: ${productName}-${version}-windows-${arch}.msix
  applicationId: VisionCLI
  displayName: VisionCLI
  backgroundColor: transparent
  languages: [en-US]
  # 1809: the startup task, the protocol and arm64 all work from there.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  # Our own startup task (off until the user turns it on) and visioncli://, not electron-builder's built-in one.
  addAutoLaunchExtension: false
  customExtensionsPath: resources/win/appx-extensions.xml
